<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shah Co. — Stock Inventory</title>
<style>
  :root {
    --navy:    #1B2A4A;
    --navy-md: #2C3E6B;
    --navy-dk: #0F1A30;
    --gold:    #C9A84C;
    --gold-lt: #FFF3CD;
    --white:   #FFFFFF;
    --off-wht: #F8F9FC;
    --slate:   #34495E;
    --green:   #6AA84F;
    --green-bg:#C6EFCE;
    --yellow:  #FFC000;
    --yellow-bg:#FFF2CC;
    --red:     #F44336;
    --red-bg:  #FFC7CE;
    --grey-bd: #D0D7E2;
    --grey-bg: #F2F4F7;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--off-wht);
    color: var(--slate);
    min-height: 100vh;
  }

  /* ── NAVY BRAND STRIP ─────────────────────────────── */
  .brand-strip {
    background: var(--navy);
    padding: 14px 0;
    border-bottom: 3px solid var(--gold);
  }
  .brand-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand-logo { display: flex; align-items: center; gap: 12px; }
  .brand-icon {
    width: 42px; height: 42px;
    background: var(--gold);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 900; color: var(--navy);
  }
  .brand-text { color: var(--white); }
  .brand-text h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; margin: 0; }
  .brand-text .sub { font-size: 11px; color: var(--gold); font-style: italic; margin-top: 2px; }
  .brand-meta { color: var(--gold); font-size: 11px; text-align: right; }
  .brand-meta .loc { color: var(--white); font-weight: 600; }

  /* ── KPI BAR ──────────────────────────────────────── */
  .kpi-bar {
    background: var(--navy-dk);
    display: flex;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--navy-md);
  }
  .kpi-item {
    flex: 1 1 130px;
    min-width: 110px;
    padding: 12px 16px;
    border-right: 1px solid var(--navy-md);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .kpi-item:last-child { border-right: none; }
  .kpi-val { font-size: 24px; font-weight: 800; color: var(--gold); line-height: 1; }
  .kpi-lbl { font-size: 10px; color: var(--white); opacity: 0.7; margin-top: 4px;
             text-transform: uppercase; letter-spacing: 0.5px; }
  .kpi-green  .kpi-val { color: var(--green); }
  .kpi-yellow .kpi-val { color: var(--yellow); }
  .kpi-red    .kpi-val { color: var(--red); }

  /* ── MAIN LAYOUT ──────────────────────────────────── */
  .main-wrap { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }

  /* ── SECTION HEADER ───────────────────────────────── */
  .sec-head {
    background: var(--navy);
    color: var(--white);
    padding: 11px 18px;
    border-radius: 7px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 700;
  }
  .sec-head .icon { font-size: 17px; }
  .sec-head .badge {
    margin-left: auto;
    background: var(--gold);
    color: var(--navy);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 12px;
    font-weight: 700;
  }

  /* ── FILTER BAR ───────────────────────────────────── */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
    align-items: center;
  }
  .filter-bar label {
    font-size: 12px; font-weight: 600; color: var(--slate); margin-right: 3px;
  }
  .filter-bar select, .filter-bar input {
    padding: 8px 11px;
    border: 1px solid var(--grey-bd);
    border-radius: 6px;
    font-size: 13px;
    background: var(--white);
    color: var(--slate);
    outline: none;
  }
  .filter-bar select:focus, .filter-bar input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px var(--gold-lt);
  }
  .search-box { flex: 1 1 200px; min-width: 140px; }

  /* ── INVENTORY GRID ───────────────────────────────── */
  .inv-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 13px;
    margin-bottom: 36px;
  }
  .inv-card {
    background: var(--white);
    border: 1px solid var(--grey-bd);
    border-radius: 9px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    transition: box-shadow 0.2s, transform 0.2s;
    position: relative;
    overflow: hidden;
  }
  .inv-card:hover {
    box-shadow: 0 5px 18px rgba(0,0,0,0.11);
    transform: translateY(-2px);
  }
  .inv-card .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .inv-card .sku {
    font-size: 10px; font-weight: 700; color: var(--gold);
    background: var(--gold-lt); padding: 3px 8px; border-radius: 3px;
    letter-spacing: 0.5px;
  }
  .inv-card .status-badge {
    font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 10px;
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .st-ok   { background: var(--green-bg);  color: #375623; }
  .st-low  { background: var(--yellow-bg); color: #7D6608; }
  .st-out  { background: var(--red-bg);    color: #9C0006; }
  .st-check{ background: #FFEBE6;          color: #B43A1A; }

  .inv-card .item-name { font-size: 16px; font-weight: 700; color: var(--navy); line-height: 1.3; }
  .inv-card .item-urdu {
    font-size: 12px; color: var(--slate); font-style: italic;
    direction: rtl; text-align: right; margin-top: -3px;
  }
  .inv-card .item-supplier { font-size: 11px; color: var(--slate); opacity: 0.7; }
  .inv-card .supplier-tag {
    display: inline-block;
    font-size: 10px; font-weight: 600; color: var(--navy);
    background: var(--grey-bg); padding: 2px 7px; border-radius: 3px;
    margin-top: 2px;
  }

  .inv-card .card-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 6px;
    margin-top: 5px;
  }
  .stat-box {
    background: var(--grey-bg);
    border-radius: 6px;
    padding: 7px 6px;
    text-align: center;
  }
  .stat-box .num {
    font-size: 16px; font-weight: 700; color: var(--navy); line-height: 1.2;
  }
  .stat-box .lbl {
    font-size: 9px; color: var(--slate); opacity: 0.7;
    text-transform: uppercase; letter-spacing: 0.3px; margin-top: 2px;
  }
  .stat-box.highlight .num { color: var(--gold); }

  .inv-card .price-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 3px;
    padding-top: 9px;
    border-top: 1px dashed var(--grey-bd);
  }
  .price-tag { font-size: 11px; color: var(--slate); }
  .price-tag strong { color: var(--navy); font-size: 15px; }
  .stock-indicator {
    font-size: 11px; font-weight: 600; color: var(--slate);
    display: flex; align-items: center; gap: 4px;
  }
  .stock-bar {
    width: 50px; height: 5px; background: var(--grey-bg);
    border-radius: 3px; overflow: hidden; display: inline-block;
  }
  .stock-bar-fill {
    height: 100%; background: var(--green); border-radius: 3px;
    transition: width 0.4s;
  }
  .stock-bar-fill.low { background: var(--yellow); }
  .stock-bar-fill.critical { background: var(--red); }

  /* ── EMPTY STATE ──────────────────────────────────── */
  .empty-msg {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px;
    color: var(--slate);
    opacity: 0.6;
    font-style: italic;
  }

  /* ── FOOTER ───────────────────────────────────────── */
  .foot {
    text-align: center;
    padding: 20px;
    color: var(--slate);
    opacity: 0.45;
    font-size: 11px;
    border-top: 1px solid var(--grey-bd);
    margin-top: 10px;
  }

  /* ── RESPONSIVE ───────────────────────────────────── */
  @media (max-width: 640px) {
    .card-stats { grid-template-columns: 1fr 1fr; }
    .kpi-item { flex: 1 1 90px; min-width: 80px; padding: 10px 12px; }
    .kpi-val { font-size: 20px; }
    .brand-inner { flex-direction: column; gap: 8px; text-align: center; }
    .brand-meta { text-align: center; }
  }
</style>
</head>
<body>

<!-- ═══════════════════ BRAND STRIP ═══════════════════ -->
<div class="brand-strip">
  <div class="brand-inner">
    <div class="brand-logo">
      <div class="brand-icon">SC</div>
      <div class="brand-text">
        <h1>Shah Co. — Stock Inventory</h1>
        <div class="sub">Wholesale Business · Peshawar · Stock Record</div>
      </div>
    </div>
    <div class="brand-meta">
      <div class="loc">Peshawar, Khyber Pakhtunkhwa</div>
      <div>Updated: <span id="today-date"></span></div>
    </div>
  </div>
</div>

<!-- ═══════════════════ KPI BAR ═══════════════════════ -->
<div class="kpi-bar" id="kpi-bar">
  <div class="kpi-item">
    <div class="kpi-val" id="kpi-total">—</div>
    <div class="kpi-lbl">Total Items</div>
  </div>
  <div class="kpi-item kpi-green">
    <div class="kpi-val" id="kpi-instock">—</div>
    <div class="kpi-lbl">In Stock</div>
  </div>
  <div class="kpi-item kpi-yellow">
    <div class="kpi-val" id="kpi-low">—</div>
    <div class="kpi-lbl">Low Stock</div>
  </div>
  <div class="kpi-item kpi-red">
    <div class="kpi-val" id="kpi-out">—</div>
    <div class="kpi-lbl">Out of Stock</div>
  </div>
  <div class="kpi-item">
    <div class="kpi-val" id="kpi-value">Rs 0</div>
    <div class="kpi-lbl">Stock Value (Rs)</div>
  </div>
</div>

<div class="main-wrap">

  <!-- ═══════════════════ INVENTORY ═══════════════════ -->
  <div class="sec-head">
    <span class="icon">📦</span> Stock Inventory
    <span class="badge" id="item-count-badge">24 items</span>
  </div>

  <div class="filter-bar">
    <label for="filter-status">Status:</label>
    <select id="filter-status">
      <option value="all">All Items</option>
      <option value="OK">OK (In Stock)</option>
      <option value="Low">Low Stock</option>
      <option value="Out of stock">Out of Stock</option>
    </select>

    <label for="filter-supplier">Supplier:</label>
    <select id="filter-supplier">
      <option value="all">All Suppliers</option>
    </select>

    <div class="search-box">
      <input type="text" id="search-box" placeholder="🔍 Search by name, SKU, or Urdu…" />
    </div>
  </div>

  <div class="inv-grid" id="inv-grid"></div>

</div>

<div class="foot">
  Shah Co. Stock Inventory · Peshawar · Data from Stock_Inventory.xlsx
</div>

<script>
/* ═══════════════════════════════════════════════════════
   STOCK DATA — 24 items · STK001–STK024
   Sourced from Stock_Inventory.xlsx (v2 Premium Edition)
   ═══════════════════════════════════════════════════════ */
const ITEMS = [
  { sku:"STK001", name:"Upper Body",        urdu:"Upper باڈی",              sup:"ABC Traders",   minStock:30, cost:35,  sell:55  },
  { sku:"STK002", name:"Cat",               urdu:"کیٹ",                       sup:"XYZ Wholesale", minStock:30, cost:20,  sell:35  },
  { sku:"STK003", name:"Bolt Jora",         urdu:"بلوٹ جوڑا",                 sup:"ABC Traders",   minStock:40, cost:12,  sell:20  },
  { sku:"STK004", name:"Barrel",            urdu:"بیرل",                      sup:"Local Market",  minStock:20, cost:45,  sell:70  },
  { sku:"STK005", name:"Zaha",              urdu:"زخہ",                       sup:"XYZ Wholesale", minStock:20, cost:18,  sell:30  },
  { sku:"STK006", name:"Poungee",           urdu:"پونگی",                     sup:"ABC Traders",   minStock:30, cost:22,  sell:38  },
  { sku:"STK007", name:"Gas Pipe",          urdu:"گیس پائپ",                  sup:"Gas Co. Ltd",   minStock:30, cost:60,  sell:95  },
  { sku:"STK008", name:"Silver Ring",       urdu:"سلور رینگ",                 sup:"Jewellery Sup.",minStock:25, cost:150, sell:220 },
  { sku:"STK009", name:"Jali Cutter",       urdu:"جالی کٹر",                  sup:"ABC Traders",   minStock:15, cost:80,  sell:120 },
  { sku:"STK010", name:"Fitting Nut",       urdu:"فٹنگ ناٹ",                  sup:"ABC Traders",   minStock:20, cost:8,   sell:15  },
  { sku:"STK011", name:"Chalan Saman Moti Wala", urdu:"چلن سامان موٹی والا", sup:"XYZ Wholesale", minStock:20, cost:25,  sell:40  },
  { sku:"STK012", name:"Chota Packet",      urdu:"چھوٹا پاکٹ",                sup:"ABC Traders",   minStock:15, cost:10,  sell:18  },
  { sku:"STK013", name:"Kashkonki",         urdu:"کشکونکے",                  sup:"XYZ Wholesale", minStock:10, cost:55,  sell:85  },
  { sku:"STK014", name:"Push Button",       urdu:"پوش بٹن",                   sup:"ABC Traders",   minStock:25, cost:15,  sell:25  },
  { sku:"STK015", name:"Karki",             urdu:"کھڑکی",                      sup:"Local Market",  minStock:20, cost:110, sell:160 },
  { sku:"STK016", name:"Upper Handle",      urdu:"Upper ہینڈل",               sup:"ABC Traders",   minStock:20, cost:40,  sell:60  },
  { sku:"STK017", name:"Motay Agay Wala",   urdu:"موٹے آگے والا",             sup:"ABC Traders",   minStock:20, cost:30,  sell:45  },
  { sku:"STK018", name:"Pipe Taiwan",       urdu:"پائپ تھائی وان",             sup:"Pipe Co.",      minStock:30, cost:70,  sell:110 },
  { sku:"STK019", name:"Cover",             urdu:"کاور",                      sup:"ABC Traders",   minStock:20, cost:20,  sell:32  },
  { sku:"STK020", name:"Weight",            urdu:"وزن",                       sup:"ABC Traders",   minStock:20, cost:28,  sell:42  },
  { sku:"STK021", name:"Weight Spring",     urdu:"وزن سپرنگ",                 sup:"ABC Traders",   minStock:20, cost:35,  sell:50  },
  { sku:"STK022", name:"Pipe Kari",         urdu:"پائپ کھڑے",                 sup:"Pipe Co.",      minStock:15, cost:50,  sell:75  },
  { sku:"STK023", name:"Magpol Patri",      urdu:"میک پول پٹری",              sup:"XYZ Wholesale", minStock:10, cost:45,  sell:65  },
  { sku:"STK024", name:"Press Ring",        urdu:"پریس رینگ",                 sup:"ABC Traders",   minStock:15, cost:90,  sell:130 },
];

// Current stock levels (from Excel computed values)
const STOCK = {
  STK001:130, STK002:100, STK003:80,  STK004:200, STK005:200,
  STK006:200, STK007:60,  STK008:120, STK009:200, STK010:200,
  STK011:200, STK012:200, STK013:10,  STK014:200, STK015:200,
  STK016:200, STK017:200, STK018:200, STK019:200, STK020:200,
  STK021:200, STK022:200, STK023:10,  STK024:200
};

/* ═══════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════ */
function getItem(sku)  { return ITEMS.find(i => i.sku === sku); }
function getStatus(i) {
  const s = STOCK[i.sku];
  if (s === undefined || s < 0) return 'Check entries';
  if (s === 0)                  return 'Out of stock';
  if (s <= i.minStock)          return 'Low';
  return 'OK';
}
function statusClass(st) {
  if (st === 'OK')         return 'st-ok';
  if (st === 'Low')        return 'st-low';
  if (st === 'Out of stock') return 'st-out';
  return 'st-check';
}
function fmtRs(n) { return 'Rs ' + Number(n).toLocaleString('en-PK'); }

function stockPercent(i) {
  // Max reasonable stock = 5× min stock
  const max = i.minStock * 5;
  return Math.min(100, Math.round((STOCK[i.sku] || 0) / max * 100));
}

/* ═══════════════════════════════════════════════════════
   KPI UPDATE
   ═══════════════════════════════════════════════════════ */
function updateKPIs() {
  const total     = ITEMS.length;
  const instock   = ITEMS.filter(i => getStatus(i) === 'OK').length;
  const low       = ITEMS.filter(i => getStatus(i) === 'Low').length;
  const out       = ITEMS.filter(i => getStatus(i) === 'Out of stock').length;
  const totalVal  = ITEMS.reduce((sum, i) => sum + (STOCK[i.sku]||0) * i.sell, 0);

  document.getElementById('kpi-total').textContent    = total;
  document.getElementById('kpi-instock').textContent  = instock;
  document.getElementById('kpi-low').textContent      = low;
  document.getElementById('kpi-out').textContent      = out;
  document.getElementById('kpi-value').textContent    = fmtRs(totalVal);
}

/* ═══════════════════════════════════════════════════════
   RENDER INVENTORY GRID
   ═══════════════════════════════════════════════════════ */
function renderInventory(filter) {
  const grid = document.getElementById('inv-grid');
  const items = ITEMS.filter(i => {
    const st = getStatus(i);
    if (filter.status !== 'all' && st !== filter.status) return false;
    if (filter.supplier !== 'all' && i.sup !== filter.supplier) return false;
    const q = (filter.query || '').toLowerCase();
    if (q && !i.sku.toLowerCase().includes(q) &&
        !i.name.toLowerCase().includes(q) &&
        !i.urdu.includes(q) &&
        !i.sup.toLowerCase().includes(q)) return false;
    return true;
  });

  document.getElementById('item-count-badge').textContent =
    items.length + ' item' + (items.length !== 1 ? 's' : '');

  if (items.length === 0) {
    grid.innerHTML = '<div class="empty-msg">No items match the current filter.</div>';
    return;
  }

  grid.innerHTML = items.map(i => {
    const st     = getStatus(i);
    const stCls  = statusClass(st);
    const stock  = STOCK[i.sku] ?? 0;
    const pct    = stockPercent(i);
    const barCls = pct <= 20 ? 'critical' : (pct <= 50 ? 'low' : '');
    const isLow  = stock > 0 && stock <= i.minStock;

    return `
      <div class="inv-card">
        <div class="card-top">
          <span class="sku">${i.sku}</span>
          <span class="status-badge ${stCls}">${st}</span>
        </div>
        <div class="item-name">${i.name}</div>
        <div class="item-urdu">${i.urdu}</div>
        <div class="supplier-tag">📦 ${i.sup}</div>
        <div class="card-stats">
          <div class="stat-box ${isLow ? 'highlight' : ''}">
            <div class="num">${stock}</div>
            <div class="lbl">In Stock</div>
          </div>
          <div class="stat-box">
            <div class="num">${i.minStock}</div>
            <div class="lbl">Min. Stock</div>
          </div>
          <div class="stat-box">
            <div class="num">${i.cost}</div>
            <div class="lbl">Cost (Rs)</div>
          </div>
          <div class="stat-box">
            <div class="num">${i.sell}</div>
            <div class="lbl">Sell (Rs)</div>
          </div>
        </div>
        <div class="stock-indicator">
          <span>Stock level</span>
          <div class="stock-bar">
            <div class="stock-bar-fill ${barCls}" style="width:${pct}%"></div>
          </div>
        </div>
      </div>`;
  }).join('');
}

/* ═══════════════════════════════════════════════════════
   FILTER LOGIC
   ═══════════════════════════════════════════════════════ */
const filterState = { status: 'all', supplier: 'all', query: '' };

function updateFilters() {
  filterState.status   = document.getElementById('filter-status').value;
  filterState.supplier = document.getElementById('filter-supplier').value;
  filterState.query    = document.getElementById('search-box').value.trim();
  renderInventory(filterState);
}

document.getElementById('filter-status').addEventListener('change', updateFilters);
document.getElementById('filter-supplier').addEventListener('change', updateFilters);
document.getElementById('search-box').addEventListener('input', updateFilters);

/* ── SUPPLIER DROPDOWN ──────────────────────────────── */
const suppliers = [...new Set(ITEMS.map(i => i.sup))].sort();
const supSel = document.getElementById('filter-supplier');
suppliers.forEach(s => {
  const opt = document.createElement('option');
  opt.value = s; opt.textContent = s;
  supSel.appendChild(opt);
});

/* ═══════════════════════════════════════════════════════
   DATE
   ═══════════════════════════════════════════════════════ */
document.getElementById('today-date').textContent =
  new Date().toLocaleDateString('en-PK', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

/* ═══════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════ */
updateKPIs();
renderInventory(filterState);
</script>
</body>
</html>
